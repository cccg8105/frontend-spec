name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag is on main
        run: |
          git fetch origin main --depth=0
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Error: tag ${{ github.ref_name }} is not an ancestor of origin/main." >&2
            exit 1
          fi

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          python scripts/bump_version.py --check
          python -c "import tomllib; v = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; assert v == '${TAG_VERSION}', f'{v} != ${TAG_VERSION}'"

      - name: Run unit tests
        run: python -m unittest discover -s cli/tests -v

      - name: Build and smoke-test wheel
        run: |
          python -m pip install --upgrade pip build
          rm -rf dist
          python -m build
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl
          /tmp/smoke-venv/bin/frontend-spec --version
          /tmp/smoke-venv/bin/fspec --version

      - name: Extract changelog section
        run: |
          python - << 'EOF'
          import os, re
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"(?ms)^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
          )
          match = pattern.search(text)
          notes = match.group(1).strip() if match else f"Release v{version}"
          Path("release_notes.md").write_text(notes + "\n", encoding="utf-8")
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release_notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
